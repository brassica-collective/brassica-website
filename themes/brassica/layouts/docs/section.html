{{ define "main" }}
  <div class="with-side-nav">
    {{ partial "side_nav.html" (dict "menuID" "handbook" "page" .) }}
    <article class="docs-page docs-section on-dirt content">
      <div class="article-inner">
        <h1>{{ .Title }}</h1>

        {{ .Content }} {{ partial "terms.html" (dict "taxonomy" "tags" "page" .) }}

        {{ partial "pager.html" . }}
      </div>
    </article>
  </div>
{{ end }}
